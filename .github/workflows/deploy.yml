name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Unit Tests
        run: npm run typecheck && npm test

      - name: Verify 3D Asset Budget (< 15 MB)
        run: npm run check:assets

      - name: Build for GitHub Pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Public client URL & anon key only (protected by Supabase Auth + RLS + shared PIN)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://vywnivkoclneaojetlpt.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5d25pdmtvY2xuZWFvamV0bHB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MTk1MTEsImV4cCI6MjExMTE5NTUxMX0.8xEH8zCnOJ1comXIxYIbvagOd52LS70ej6yjBMZZv4o' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
